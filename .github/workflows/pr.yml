name: PR checks

on:
  pull_request:
    branches: [main]

# 默认权限：只读代码。需要更多权限的 Job 单独声明
permissions:
  contents: read

# 同一个 PR 连续推送时，取消上一次还没跑完的运行，节省时间
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Run tests
        run: pytest -v

  terraform:
    name: Terraform plan (dev)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write       # 申请 OIDC 令牌
      pull-requests: write  # 在 PR 上评论
    defaults:
      run:
        working-directory: infra/envs/dev
    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.17.0"  # 和本地版本一致
          terraform_wrapper: false

      - name: Terraform fmt
        run: terraform fmt -check -recursive ../../

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ap-southeast-2

      - name: Who am I
        run: aws sts get-caller-identity

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: terraform plan -input=false -no-color -out=tfplan

      - name: Comment plan on PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PLAN=$(terraform show -no-color tfplan | tail -c 60000)
          SUMMARY=$(echo "$PLAN" | grep -E '^(Plan:|No changes)' || echo "详见完整 plan")

          cat > comment.md <<EOF
          ### 🏗 Terraform plan（dev）

          **${SUMMARY}**

          <details><summary>展开完整 plan</summary>

          \`\`\`
          ${PLAN}
          \`\`\`

          </details>

          提交：\`${{ github.event.pull_request.head.sha }}\`
          EOF

          gh pr comment ${{ github.event.pull_request.number }} \
            --body-file comment.md --edit-last --create-if-none
