name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: # 允许在网页上手动触发

permissions:
  contents: read

# 部署任务排队执行，绝不中途取消（否则可能导致 apply 进行到一半、state 锁无法释放）
concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to dev
    runs-on: ubuntu-latest
    environment:
      name: dev
      url: https://dev.edgeboard.click
    permissions:
      contents: read
      id-token: write
    env:
      TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.17.0"
          terraform_wrapper: false

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: ap-southeast-2

      - name: Who am I
        run: aws sts get-caller-identity

      # ===== 1. 基础设施 + Lambda 代码 =====
      - name: Terraform init
        working-directory: infra/envs/dev
        run: terraform init -input=false

      - name: Terraform plan
        working-directory: infra/envs/dev
        run: terraform plan -input=false -no-color -out=tfplan

      - name: Terraform apply
        working-directory: infra/envs/dev
        run: terraform apply -input=false -no-color tfplan

      - name: Read outputs
        id: tf
        working-directory: infra/envs/dev
        run: |
          echo "bucket=$(terraform output -raw site_bucket_name)" >> "$GITHUB_OUTPUT"
          echo "distribution=$(terraform output -raw distribution_id)" >> "$GITHUB_OUTPUT"

      # ===== 2. 前端 =====
      - name: Build frontend
        run: ./scripts/build-frontend.sh

      - name: Upload hashed assets (cache 1 year)
        run: |
          aws s3 sync frontend/dist "s3://${{ steps.tf.outputs.bucket }}/" \
            --exclude "index.html" \
            --cache-control "public, max-age=31536000, immutable"

      - name: Upload index.html (no-cache)
        run: |
          aws s3 cp frontend/dist/index.html "s3://${{ steps.tf.outputs.bucket }}/index.html" \
            --cache-control "no-cache"

      - name: Invalidate index.html
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.tf.outputs.distribution }}" \
            --paths "/index.html" "/"
