<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EdgeBoard</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main>
    <header>
      <h1>EdgeBoard</h1>
      <p class="visits">You are visitor #<span id="visits">…</span></p>
    </header>

    <section>
      <h2>Messages</h2>
      <form id="message-form">
        <input id="author" type="text" placeholder="Name (optional)" maxlength="30" autocomplete="nickname">
        <textarea id="message" placeholder="Say something…" maxlength="500" rows="3" required></textarea>
        <div class="form-footer">
          <span id="char-count">0 / 500</span>
          <button id="submit" type="submit">Post</button>
        </div>
        <p id="form-error" class="error" role="alert"></p>
      </form>
    </section>

    <section>
      <ul id="messages"></ul>
      <p id="list-error" class="error" role="alert"></p>
      <button id="load-more" type="button" hidden>Load more</button>
    </section>

    <footer>Version <code>__VERSION__</code></footer>
  </main>
</body>
</html>
